<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Universe: MASTER ADMIN PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script>
        // Your web app\'s Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDvwKe3zuT75m5BtXAMm3Z2sN_6Erl9VlE",
            authDomain: "ultimate-team-online.firebaseapp.com",
            projectId: "ultimate-team-online",
            storageBucket: "ultimate-team-online.firebasestorage.app",
            messagingSenderId: "121427180098",
            appId: "1:121427180098:web:088d523d35c1fccc350bdb",
            measurementId: "G-XYMCRH1JZ3"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const usersCollection = db.collection(\'users\');
        const playersCollection = db.collection(\'players\'); // Assuming players are also global

        console.log("Firebase Admin inicializado.");
    </script>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --accent: #00ff88; --text: #ffffff;
            --radius: 12px; --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-family: 'Montserrat'; text-transform: uppercase; font-size: 1.5rem; color: var(--accent); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: var(--card); border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 0.8rem; border: 1px solid #333; }
        .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .card { background: var(--card); border-radius: var(--radius); padding: 20px; border: 1px solid #333; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.7rem; font-weight: 800; color: #888; text-transform: uppercase; }
        input, select, textarea { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; outline: none; font-size: 0.9rem; }
        input:focus { border-color: var(--accent); }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; transition: var(--transition); text-transform: uppercase; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #333; color: #fff; }
        .player-list { display: grid; gap: 10px; }
        .player-item { background: #000; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .ovr-badge { background: var(--accent); color: #000; font-weight: 900; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 600px; padding: 30px; border-radius: 20px; border: 1px solid #333; max-height: 90vh; overflow-y: auto; }
        .sync-box { background: #000; padding: 15px; border-radius: 10px; border: 1px solid var(--accent); margin-top: 20px; }
        #sync-code { width: 100%; height: 100px; background: transparent; border: none; color: var(--accent); font-family: monospace; font-size: 0.7rem; resize: none; margin-top: 10px; outline: none; }
    </style>
</head>
<body>
    <div id="admin-login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;">
        <h1 style="font-family: 'Montserrat'; font-weight: 900; color: var(--accent); margin-bottom: 20px;">ACESSO RESTRITO</h1>
        <p style="color: #888; margin-bottom: 30px; font-size: 0.8rem;">INSIRA A SENHA MASTER PARA ACESSAR O PAINEL</p>
        <input type="password" id="admin-pass-input" style="background: var(--card); border: 1px solid var(--accent); color: #fff; padding: 15px; border-radius: var(--radius); width: 100%; max-width: 300px; text-align: center; font-size: 1.2rem; margin-bottom: 20px;" placeholder="SENHA">
        <button class="btn btn-primary" style="width: 100%; max-width: 300px;" onclick="checkAdminPass()">ENTRAR NO SISTEMA</button>
    </div>

    <div id="toast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 800; font-size: 0.7rem; z-index: 10000; display: none;">MENSAGEM</div>

    <div class="container" style="display: none;" id="main-admin-ui">
        <header>
            <h1>MASTER ADMIN</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" onclick="exportData()"><i data-lucide="download"></i> EXPORTAR</button>
                <button class="btn btn-primary" onclick="generateSync()"><i data-lucide="refresh-cw"></i> GERAR CÓDIGO</button>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="showTab('players')">JOGADORES</div>
            <div class="tab" onclick="showTab('economy')">USUÁRIOS & ECONOMIA</div>
        </div>

        <!-- PLAYERS TAB -->
        <div id="tab-players">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="font-size: 1rem;">BANCO DE DADOS</h2>
                    <button class="btn btn-primary" onclick="openPlayerModal()"><i data-lucide="plus"></i> NOVO JOGADOR</button>
                </div>
                <div class="player-list" id="player-list"></div>
            </div>
        </div>

        <!-- ECONOMY TAB -->
        <div id="tab-economy" style="display: none;">
            <div class="card">
                <h2 style="font-size: 1rem; margin-bottom: 20px;">GESTÃO DE USUÁRIOS</h2>
                <div class="input-group" style="margin-bottom: 20px;">
                    <input type="text" id="user-search" placeholder="Buscar por Nome ou E-mail..." oninput="searchUsers()">
                </div>
                <div id="user-list" class="player-list"></div>
            </div>
        </div>

        <div class="sync-box" id="sync-container" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>CÓDIGO DE SINCRONIZAÇÃO (COLE NO JOGO)</label>
                <button class="btn btn-primary" style="padding: 5px 10px; font-size: 0.6rem;" onclick="copySync()">COPIAR</button>
            </div>
            <textarea id="sync-code" readonly></textarea>
        </div>
    </div>

    <!-- PLAYER MODAL -->
    <div class="modal" id="player-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 20px;">EDITAR JOGADOR</h2>
            <div class="form-grid">
                <div class="input-group"><label>NOME</label><input type="text" id="p-nome"></div>
                <div class="input-group"><label>OVR</label><input type="number" id="p-ovr"></div>
                <div class="input-group">
                    <label>POSIÇÃO</label>
                    <select id="p-pos">
                        <option value="GOL">GOLEIRO (GOL)</option>
                        <option value="DEF">DEFENSOR (DEF)</option>
                        <option value="MEI">MEIO-CAMPO (MEI)</option>
                        <option value="ATA">ATACANTE (ATA)</option>
                    </select>
                </div>
                <div class="input-group"><label>LIGA</label><input type="text" id="p-liga"></div>
                <div class="input-group">
                    <label>RARIDADE</label>
                    <select id="p-raridade">
                        <option value="raro">RARO</option>
                        <option value="super_raro">SUPER RARO</option>
                        <option value="icon">ICON</option>
                    </select>
                </div>
                <div class="input-group"><label>CHANCE DROP (0.01 = 1%)</label><input type="number" step="0.0001" id="p-chance"></div>
                <div class="input-group"><label>VALOR MERCADO</label><input type="number" id="p-valor"></div>
                <div class="input-group" style="grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 10px;">
                    <input type="checkbox" id="p-market" style="width: 20px; height: 20px;">
                    <label style="margin: 0;">LISTAR NO MERCADO AGORA</label>
                </div>
                <div class="input-group"><label>EXPIRAÇÃO (MINUTOS)</label><input type="number" id="p-expire"></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="savePlayer()">SALVAR JOGADOR</button>
                <button class="btn btn-outline" onclick="closeModal()">CANCELAR</button>
            </div>
        </div>
    </div>

    <script>
        let players = []; // Will be loaded from Firebase
        // Initial load of players and users (for local storage fallback/initialization)
        let localPlayers = JSON.parse(localStorage.getItem(\'ut_master_db_v3\')) || [];
        let localUsers = JSON.parse(localStorage.getItem(\'ut_users_db\')) || [];
        let users = []; // Will be loaded from Firebase
        let editingId = null;

        function showTab(tab) {
            document.getElementById('tab-players').style.display = tab === 'players' ? 'block' : 'none';
            document.getElementById('tab-economy').style.display = tab === 'economy' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if(tab === 'players') await renderPlayers();
            if(tab === 'economy') await renderUsers();
        }

        async function renderPlayers() {
            const list = document.getElementById(\'player-list\');
            players = []; // Clear local players array
            try {
                const snapshot = await playersCollection.get();
                snapshot.forEach(doc => {
                    players.push(doc.data());
                });
                console.log("Jogadores carregados no painel do Firebase.", players);
            } catch (error) {
                console.error("Erro ao carregar jogadores do Firebase:", error.message);
                // Fallback to local storage if Firebase fails
                players = localPlayers;
                showToast("ERRO ao carregar jogadores do Firebase. Usando dados locais.");
            }

            list.innerHTML = players.map(p => `
                <div class="player-item">
                    <div class="player-info">
                        <div class="ovr-badge">${p.ovr}</div>
                        <div>
                            <div style="font-weight: 800;">${p.nome}</div>
                            <div style="font-size: 0.6rem; color: #888;">${p.posicao} | ${p.liga} | ${p.raridade.toUpperCase()}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn btn-outline" style="padding: 5px 10px;" onclick="openPlayerModal(\'${p.id}\')"><i data-lucide="edit-2" style="width: 14px;"></i></button>
                        <button class="btn btn-danger" style="padding: 5px 10px;" onclick="deletePlayer(\'${p.id}\')"><i data-lucide="trash-2" style="width: 14px;"></i></button>
                    </div>
                </div>
            `).join(\'\');
            lucide.createIcons();
        }

        function openPlayerModal(id = null) {
            editingId = id;
            const p = id ? players.find(x => x.id === id) : { nome: '', ovr: 80, posicao: 'ATA', liga: 'Global', raridade: 'raro', chance: 0.01, valor: 5000, onMarket: false, expireMin: 0 };
            document.getElementById('p-nome').value = p.nome;
            document.getElementById('p-ovr').value = p.ovr;
            document.getElementById('p-pos').value = p.posicao;
            document.getElementById('p-liga').value = p.liga;
            document.getElementById('p-raridade').value = p.raridade;
            document.getElementById('p-chance').value = p.chance;
            document.getElementById('p-valor').value = p.valor;
            document.getElementById('p-market').checked = p.onMarket;
            document.getElementById('p-expire').value = p.expireMin;
            document.getElementById('player-modal').classList.add('active');
        }

        function savePlayer() {
            const p = {
                id: editingId || 'p_' + Date.now(),
                nome: document.getElementById('p-nome').value,
                ovr: parseInt(document.getElementById('p-ovr').value),
                posicao: document.getElementById('p-pos').value,
                liga: document.getElementById('p-liga').value,
                raridade: document.getElementById('p-raridade').value,
                chance: parseFloat(document.getElementById('p-chance').value),
                valor: parseInt(document.getElementById('p-valor').value),
                onMarket: document.getElementById('p-market').checked,
                marketAddedAt: Date.now(),
                expireMin: parseInt(document.getElementById('p-expire').value),
                atributos: { velocidade: 80, finalizacao: 80, passe: 80, defesa: 80, fisico: 80, reflexo: 80 }
            };
            try {
                if(editingId) {
                    await playersCollection.doc(p.id).set(p);
                    const idx = players.findIndex(x => x.id === editingId);
                    players[idx] = p;
                    console.log("Jogador atualizado no Firebase e localmente:", p);
                } else {
                    await playersCollection.doc(p.id).set(p);
                    players.push(p);
                    console.log("Novo jogador adicionado no Firebase e localmente:", p);
                }
                localStorage.setItem("ut_master_db_v3", JSON.stringify(players)); // Keep local storage updated for fallback
                renderPlayers(); closeModal();
                alert("JOGADOR SALVO COM SUCESSO!");
            } catch (error) {
                console.error("Erro ao salvar jogador no Firebase:", error.message);
                alert("ERRO ao salvar jogador: " + error.message);
            }
        }

        async function deletePlayer(id) {
            if(confirm("DELETAR JOGADOR?")) {
                try {
                    await playersCollection.doc(id).delete();
                    players = players.filter(x => x.id !== id);
                    localStorage.setItem("ut_master_db_v3", JSON.stringify(players)); // Keep local storage updated for fallback
                    renderPlayers();
                    alert("JOGADOR DELETADO COM SUCESSO!");
                } catch (error) {
                    console.error("Erro ao deletar jogador do Firebase:", error.message);
                    alert("ERRO ao deletar jogador: " + error.message);
                }
            }
        }

        async function renderUsers() {
            const list = document.getElementById("user-list");
            const search = document.getElementById("user-search").value.toLowerCase();
            
            let allUsers = [];
            try {
                const snapshot = await usersCollection.get();
                snapshot.forEach(doc => {
                    allUsers.push(doc.data());
                });
                console.log("Usuários carregados no painel do Firebase.", allUsers);
            } catch (error) {
                console.error("Erro ao carregar usuários do Firebase:", error.message);
                showToast("ERRO ao carregar usuários.");
            }

            const filtered = allUsers.filter(u => u.username.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
            list.innerHTML = filtered.map(u => `
                <div class="player-item">
                    <div>
                        <div style="font-weight: 800;">${u.username}</div>
                        <div style="font-size: 0.6rem; color: #888;">${u.email}</div>
                        <div style="font-size: 0.7rem; margin-top: 5px;">💰 ${u.coins.toLocaleString()} | 💎 ${u.gems.toLocaleString()}</div>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn btn-primary" style="padding: 5px 10px; font-size: 0.6rem;" onclick="rewardUser(\'${u.id}\', \'coins\')">+ COINS</button>
                        <button class="btn btn-primary" style="padding: 5px 10px; font-size: 0.6rem; background: #00f2ff;" onclick="rewardUser(\'${u.id}\', \'gems\')">+ GEMS</button>
                    </div>
                </div>
            `).join(\'\');
        }

        async function rewardUser(id, type) {
            const val = prompt(`QUANTIDADE DE ${type.toUpperCase()} A ENVIAR:`);
            if(!val || isNaN(val)) return;
            
            try {
                const userDoc = await usersCollection.doc(id).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    const newValue = userData[type] + parseInt(val);
                    await usersCollection.doc(id).update({ [type]: newValue });
                    console.log(`Usuário ${id} atualizado no Firebase: ${type} = ${newValue}`);
                    
                    // Update local users array if it exists
                    const idx = users.findIndex(u => u.id == id);
                    if (idx !== -1) {
                        users[idx][type] = newValue;
                        localStorage.setItem("ut_users_db", JSON.stringify(users));
                    }
                    
                    renderUsers(); 
                    alert("ENVIADO COM SUCESSO!");
                } else {
                    alert("Usuário não encontrado no Firebase.");
                }
            } catch (error) {
                console.error("Erro ao atualizar usuário no Firebase:", error.message);
                alert("ERRO ao enviar: " + error.message);
            }
        }

        function generateSync() {
            const code = btoa(unescape(encodeURIComponent(JSON.stringify(players))));
            document.getElementById('sync-code').value = code;
            document.getElementById('sync-container').style.display = 'block';
        }

        function copySync() {
            const copyText = document.getElementById("sync-code");
            copyText.select();
            document.execCommand("copy");
            alert("CÓDIGO COPIADO!");
        }

        function closeModal() { document.getElementById('player-modal').classList.remove('active'); }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        async function checkAdminPass() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === "L@13052010evi") {
                document.getElementById('admin-login-overlay').style.display = 'none';
                document.getElementById('main-admin-ui').style.display = 'block';
                showToast("ACESSO CONCEDIDO!");
                await renderPlayers(); 
                await renderUsers();
            } else {
                alert("SENHA INCORRETA!");
            }
        }

        // Only render after login
        lucide.createIcons();
    </script>
</body>
</html>
